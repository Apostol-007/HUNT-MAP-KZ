name: HUNT MAP KZ - unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'IPA only or full verification'
        type: choice
        options: [ipa, full]
        default: ipa
      runner:
        description: 'macOS runner architecture'
        type: choice
        options: [macos-15-intel, macos-15, macos-26-intel, macos-26]
        default: macos-15-intel
  pull_request:
    paths:
      - 'iOS/**'
      - 'Core/**'
      - 'server/**'
      - 'scripts/**'
      - '.github/workflows/ios-unsigned-ipa.yml'
  push:
    branches: [main]
    paths:
      - 'iOS/**'
      - 'Core/**'
      - 'server/**'
      - 'scripts/**'
      - 'tools/prepare_protomaps_grid.py'
      - '.github/workflows/ios-unsigned-ipa.yml'

concurrency:
  group: hunt-ios-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Swift Core and server tests
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Test HuntCore
        run: swift test --package-path Core
      - name: Validate bundled grounds
        run: python3 scripts/verify_bundled_grounds.py iOS/HuntMap/HuntGrounds153.geojson
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server test dependencies
        run: python -m pip install -r server/requirements.txt pytest httpx
      - name: Test server
        run: python -m pytest -q server/tests

  ios:
    name: Compile iOS and package unsigned IPA
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate Xcode project
        working-directory: iOS
        run: xcodegen generate --spec project.yml
      - name: Cache Swift package downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/HuntPackages
          key: hunt-spm-device-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iOS/project.yml', 'Core/Package.swift') }}
          restore-keys: |
            hunt-spm-device-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build for physical iPhone without signing
        working-directory: iOS
        env:
          HUNT_OFFLINE_STYLE_URL: ${{ vars.HUNT_OFFLINE_STYLE_URL }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: |
          set -o pipefail
          xcodebuild \
            -project HuntMapKZ.xcodeproj \
            -scheme HuntMapKZ \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HuntBuild" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/HuntPackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            HUNT_OFFLINE_STYLE_URL="$HUNT_OFFLINE_STYLE_URL" \
            MAPTILER_API_KEY="$MAPTILER_API_KEY" \
            build 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
      - name: Package and inspect IPA
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/HuntBuild/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/HuntMapKZ.app"
          test -d "$APP" || { echo "Expected .app not found: $APP"; exit 1; }
          test -f "$APP/Info.plist" || { echo "Info.plist missing"; exit 1; }
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")
          test -f "$APP/$EXECUTABLE" || { echo "App executable missing"; exit 1; }
          test -f "$APP/HuntGrounds153.geojson" || { echo "Embedded grounds missing"; exit 1; }
          python3 scripts/verify_bundled_grounds.py "$APP/HuntGrounds153.geojson"
          # Prevent a green IPA build when the library UI exists but PDF assets are missing.
          for document in wildlife-protection.pdf rules-civil-service-weapons.pdf approval-voucher-form-rules.pdf approval-hunting-rules.pdf; do
            if ! find "$APP" -type f -name "$document" | grep -q .; then
              echo "Required legal-library PDF not embedded: $document"
              exit 1
            fi
          done
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys, pathlib, re
          with open(sys.argv[1], "rb") as f:
              info = plistlib.load(f)
          icons = info.get("CFBundleIcons", {})
          assert not icons.get("CFBundleAlternateIcons"), "Unexpected alternate icons"
          assert icons.get("CFBundlePrimaryIcon")
          assert info.get("CFBundleDisplayName") == "QAZ TRAIL"
          print("PASS: QAZ TRAIL, single primary icon")
          PY
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist"
          OUT="$RUNNER_TEMP/unsigned-output"
          mkdir -p "$OUT/Payload"
          ditto "$APP" "$OUT/Payload/HuntMapKZ.app"
          (cd "$OUT" && /usr/bin/zip -qry HUNT_MAP_KZ_unsigned.ipa Payload)
          /usr/bin/unzip -t "$OUT/HUNT_MAP_KZ_unsigned.ipa" | tail -1
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HUNT_MAP_KZ_unsigned_IPA
          path: ${{ runner.temp }}/unsigned-output/HUNT_MAP_KZ_unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload build log for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore
          retention-days: 7

  simulator:
    name: iOS simulator smoke tests
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: iOS
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Cache simulator Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/HuntSimulatorPackages
          key: hunt-spm-simulator-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iOS/project.yml', 'Core/Package.swift') }}
          restore-keys: |
            hunt-spm-simulator-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Select available iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 scripts/select_ios_simulator.py "$RUNNER_TEMP/devices.json" >> "$GITHUB_ENV"
      - name: Boot simulator
        run: |
          xcrun simctl boot "$HUNT_SIMULATOR_ID" || true
          xcrun simctl bootstatus "$HUNT_SIMULATOR_ID" -b
      - name: Run real application UI smoke tests
        working-directory: iOS
        run: |
          set -o pipefail
          xcodebuild -project HuntMapKZ.xcodeproj \
            -scheme HuntMapKZ -configuration Debug \
            -destination "platform=iOS Simulator,id=$HUNT_SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/hunt-ui.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/HuntSimulatorBuild" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/HuntSimulatorPackages" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/ios-ui-test.log"
      - name: Export screenshot attachments
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/hunt-ui.xcresult"; then
            mkdir -p "$RUNNER_TEMP/hunt-screenshots"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/hunt-ui.xcresult" --output-path "$RUNNER_TEMP/hunt-screenshots"
          fi
      - name: Upload UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunt-ui-evidence
          path: |
            ${{ runner.temp }}/hunt-ui.xcresult
            ${{ runner.temp }}/hunt-screenshots/
            ${{ runner.temp }}/ios-ui-test.log
          if-no-files-found: error
          retention-days: 14
