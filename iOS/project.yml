name: HuntMapKZ
options:
  bundleIdPrefix: kz.huntmap
  deploymentTarget:
    iOS: "17.0"
packages:
  HuntCore:
    path: ../Core
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
targets:
  HuntMapKZ:
    type: application
    platform: iOS
    sources:
      - HuntMap
    dependencies:
      - package: HuntCore
      - package: MapLibre
    info:
      path: HuntMap/Info.plist
      properties:
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - location
        MapTilerAPIKey: "$(MAPTILER_API_KEY)"
        HuntOfflineStyleURL: "$(HUNT_OFFLINE_STYLE_URL)"
        NSLocationWhenInUseUsageDescription: "Показать позицию и предупреждать о границах во время использования карты"
        NSLocationAlwaysAndWhenInUseUsageDescription: "Записывать маршрут и предупреждать о границах во время активной полевой сессии с заблокированным экраном"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.huntmap.field
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 5.3.0
        CURRENT_PROJECT_VERSION: 53
        SWIFT_VERSION: 5.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
