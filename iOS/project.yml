name: HuntMapKZ
options:
  bundleIdPrefix: kz.huntmap
  deploymentTarget:
    iOS: "17.0"
packages:
  HuntCore:
    path: ../Core
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
targets:
  HuntMapKZ:
    type: application
    platform: iOS
    sources:
      - HuntMap
    entitlements:
      path: HuntMap.entitlements
    dependencies:
      - package: HuntCore
      - package: MapLibre
      - target: HuntMapRouteWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.huntmap.field
        CODE_SIGN_ENTITLEMENTS: HuntMap.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 1.7.16
        CURRENT_PROJECT_VERSION: 1716
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIBackgroundModes: location
        SWIFT_VERSION: 5.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Показать позицию и предупреждать о границах во время использования карты"
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Записывать маршрут и предупреждать о границах во время активной полевой сессии с заблокированным экраном"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  HuntMapRouteWidget:
    type: app-extension
    platform: iOS
    sources:
      - HuntMapRouteWidget
    entitlements:
      path: HuntMapRouteWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.huntmap.field.routewidget
        CODE_SIGN_ENTITLEMENTS: HuntMapRouteWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HuntMapRouteWidget/Info.plist
        MARKETING_VERSION: 1.7.16
        CURRENT_PROJECT_VERSION: 1716
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
