name: HuntMapKZ
options:
  bundleIdPrefix: kz.huntmap
  deploymentTarget:
    iOS: "17.0"
packages:
  HuntCore:
    path: ../Core
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
targets:
  HuntMapKZ:
    type: application
    platform: iOS
    sources:
      - HuntMap
    dependencies:
      - package: HuntCore
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.huntmap.field
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_MapTilerAPIKey: "$(MAPTILER_API_KEY)"
        MARKETING_VERSION: 4.0.0
        CURRENT_PROJECT_VERSION: 40
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIBackgroundModes: location
        SWIFT_VERSION: 5.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Показать позицию и предупреждать о границах во время использования карты"
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Записывать маршрут и предупреждать о границах во время активной полевой сессии с заблокированным экраном"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
